services:
  occ:
    build: .
    ports:
      - "4242:4242"
    volumes:
      - ./chains:/app/chains
      - ./pipelines:/app/pipelines
    environment:
      - REST_PORT=4242
      - CHAINS_DIR=/app/chains
      - PIPELINES_DIR=/app/pipelines
      - CLAUDE_CLI=claude
    restart: unless-stopped
