name: quick-summarizer
description: "Summarize any URL in 3 parallel perspectives — 3x faster than sequential"
version: "1.0"

# BENCHMARK: 3 agents run in parallel = ~12s wall time vs ~36s sequential
# Token savings: each agent gets ONLY its perspective context, not the full conversation

inputs:
  - name: url
    description: "URL to summarize"
  - name: language
    description: "Output language"
    optional: true

steps:
  # ── Wave 1: 3 parallel perspectives (no depends_on = automatic parallel) ──
  - id: factual
    model: claude-haiku-4-5
    pre_tools:
      - type: http_fetch
        url: "{input.url}"
        inject_as: page_content
        timeout_ms: 10000
      - type: current_datetime
        inject_as: now
    prompt: |
      Extract the KEY FACTS from this page. Be precise — dates, numbers, names, claims.
      No opinions, no interpretation. Just facts.

      Page content:
      {page_content}

      Output language: {input.language}
    output_var: facts
    timeout_ms: 30000

  - id: critical
    model: claude-haiku-4-5
    pre_tools:
      - type: http_fetch
        url: "{input.url}"
        inject_as: page_content
        cache_ttl_minutes: 5
    prompt: |
      Read this page with a CRITICAL eye. Identify:
      - Unsupported claims or logical fallacies
      - Missing context or cherry-picked data
      - Potential biases (commercial, political, ideological)
      - What the page does NOT say that it should

      Page content:
      {page_content}

      Output language: {input.language}
    output_var: critique
    timeout_ms: 30000

  - id: actionable
    model: claude-haiku-4-5
    pre_tools:
      - type: http_fetch
        url: "{input.url}"
        inject_as: page_content
        cache_ttl_minutes: 5
    prompt: |
      From this page, extract ACTIONABLE takeaways. What should the reader DO with this information?
      - Concrete next steps
      - Decisions this informs
      - Follow-up research needed

      Page content:
      {page_content}

      Output language: {input.language}
    output_var: actions
    timeout_ms: 30000

  # ── Wave 2: Merge (runs after all 3 complete) ──
  - id: synthesize
    type: merge
    depends_on: [factual, critical, actionable]
    inputs: [facts, critique, actions]
    strategy: llm_summarize
    model: claude-sonnet-4-6
    prompt: |
      Combine these 3 perspectives into a single, structured summary:

      ## Key Facts
      {facts}

      ## Critical Analysis
      {critique}

      ## Actionable Takeaways
      {actions}

      Create a cohesive briefing that balances factual reporting with critical thinking and practical next steps.
      Use headers: Facts, Red Flags, What To Do Next.

      Output language: {input.language}
    output_var: summary

output: summary
