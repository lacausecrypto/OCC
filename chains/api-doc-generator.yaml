name: api-doc-generator
description: "Generate full API docs from source code — pre-tools extract, LLM documents"
version: "1.0"

# BENCHMARK: Pre-tools extract code structure with 0 tokens.
# 4 parallel doc generators = ~20s. Manual documentation = hours.
# Token savings: AST extraction means LLM sees ONLY function signatures, not full source code
# A 10K line codebase becomes ~2K tokens of signatures → 80% token reduction

inputs:
  - name: path
    description: "Source code directory"
  - name: format
    description: "Output format: markdown, openapi, or jsdoc"
    optional: true

steps:
  # ── Wave 1: Extract code structure with 0 LLM tokens ──
  - id: extract-structure
    type: transform
    operation: template
    pre_tools:
      - type: ast_parse
        path: "{input.path}"
        extract: ["functions", "classes", "exports"]
        inject_as: ast
      - type: bash
        command: "cd '{input.path}' && head -5 package.json 2>/dev/null || head -3 setup.py 2>/dev/null || head -3 go.mod 2>/dev/null || echo '{\"name\": \"unknown\"}'"
        inject_as: project_meta
    prompt: "Extract code structure"
    template_str: "AST:\n{ast}\n\nProject:\n{project_meta}"
    output_var: code_structure

  # ── Wave 2: 4 parallel documentation agents ──
  - id: doc-endpoints
    depends_on: [extract-structure]
    model: claude-haiku-4-5
    prompt: |
      From this code structure, document ALL API endpoints/routes.
      For each endpoint: method, path, parameters, request body, response format, error codes.

      {code_structure}

      Format: {input.format}
      Output structured documentation only.
    output_var: endpoints_doc

  - id: doc-models
    depends_on: [extract-structure]
    model: claude-haiku-4-5
    prompt: |
      From this code structure, document ALL data models/types/interfaces.
      For each: name, fields with types, required/optional, validation rules, relationships.

      {code_structure}

      Format: {input.format}
      Output structured documentation only.
    output_var: models_doc

  - id: doc-auth
    depends_on: [extract-structure]
    model: claude-haiku-4-5
    prompt: |
      From this code structure, document the authentication and authorization system.
      Cover: auth methods, token formats, permission levels, middleware, error handling.

      {code_structure}

      Format: {input.format}
      Output structured documentation only.
    output_var: auth_doc

  - id: doc-examples
    depends_on: [extract-structure]
    model: claude-haiku-4-5
    prompt: |
      From this code structure, generate practical usage examples.
      For each major endpoint/function: curl command, expected response, common use cases, error scenarios.

      {code_structure}

      Format: {input.format}
      Output examples only — no theory.
    output_var: examples_doc

  # ── Wave 3: Assemble final docs ──
  - id: assemble
    type: merge
    depends_on: [doc-endpoints, doc-models, doc-auth, doc-examples]
    inputs: [endpoints_doc, models_doc, auth_doc, examples_doc]
    strategy: llm_summarize
    model: claude-sonnet-4-6
    prompt: |
      Assemble these 4 documentation sections into a single, coherent API reference:

      ## Endpoints
      {endpoints_doc}

      ## Data Models
      {models_doc}

      ## Authentication
      {auth_doc}

      ## Examples
      {examples_doc}

      Output a clean, professional API documentation. Add a table of contents at the top.
      Remove duplicates. Ensure consistent formatting.
    output_var: full_docs

output: full_docs
