name: full-stack-scaffold
description: "AI-powered project scaffolder — designs architecture, generates file structure, writes boilerplate code, configures CI/CD, and produces documentation. Demonstrates: tools (Bash, Write, Read), conditional steps, pre_tools (bash, env_var), retry with fallback models, and caching."
version: "1.0"

inputs:
  - name: project_name
    description: "Name for the new project"
  - name: description
    description: "What the project should do (1-3 sentences)"
  - name: stack
    description: "Tech stack preference (e.g., 'Next.js + Supabase', 'FastAPI + PostgreSQL', 'Express + MongoDB')"
    optional: true
  - name: output_dir
    description: "Directory to create the project in (default: /tmp)"
    optional: true

steps:
  # ── STEP 1: Architecture design ────────────────────────────────

  - id: design
    type: agent
    label: "Architecture design"
    model: claude-sonnet-4-6
    pre_tools:
      - type: current_datetime
        inject_as: today
    prompt: |
      Design the architecture for this project:

      Name: {input.project_name}
      Description: {input.description}
      Stack preference: {input.stack}
      Date: {today}

      Produce a technical design document:

      ## Architecture

      ### Stack Decision
      Choose specific technologies. Justify each choice in one line.
      - Frontend: ...
      - Backend: ...
      - Database: ...
      - Auth: ...
      - Hosting: ...

      ### File Structure
      ```
      project-root/
      ├── src/
      │   ├── ...
      ```
      List EVERY file that needs to be created.

      ### Data Model
      Define database tables/collections with fields and types.

      ### API Routes
      List all API endpoints: METHOD /path — description

      ### Environment Variables
      List all env vars needed with descriptions.

      Output as structured, actionable spec. No vague statements.
    output_var: architecture
    cache:
      enabled: true
      ttl_minutes: 120
    timeout_ms: 180000

  # ── STEP 2: Generate project files ─────────────────────────────

  - id: scaffold
    type: agent
    label: "Generate project files"
    depends_on: [design]
    model: claude-sonnet-4-6
    tools: [Bash, Write, Read]
    prompt: |
      Create the project based on this architecture:

      {architecture}

      Output directory: {input.output_dir}/

      Instructions:
      1. Create the directory structure
      2. Write all source files with REAL, working code (not stubs)
      3. Write package.json / requirements.txt with all dependencies
      4. Write a .env.example with all needed variables
      5. Write a docker-compose.yml if applicable
      6. Make sure the project can actually start with `npm run dev` or equivalent

      Create every file listed in the architecture. No placeholders.
    output_var: scaffold_result
    retry:
      max: 2
      delay_ms: 3000
    fallback_models: ["claude-opus-4-6"]
    timeout_ms: 600000

  # ── STEP 3: Generate tests ─────────────────────────────────────

  - id: write_tests
    type: agent
    label: "Generate test suite"
    depends_on: [scaffold]
    model: claude-sonnet-4-6
    tools: [Read, Write, Glob]
    prompt: |
      Read the generated project at: {input.output_dir}/

      Architecture: {architecture}

      Write a comprehensive test suite:
      1. Unit tests for all utility functions
      2. Integration tests for API routes
      3. At least one end-to-end test
      4. Test configuration (jest.config / vitest.config / pytest.ini)

      Write REAL tests that would actually catch bugs.
      Ensure imports match the actual file structure.
    output_var: test_result
    timeout_ms: 300000

  # ── STEP 4: Generate README ────────────────────────────────────

  - id: write_docs
    type: agent
    label: "Generate documentation"
    depends_on: [scaffold, write_tests]
    model: claude-sonnet-4-6
    tools: [Read, Write]
    prompt: |
      Generate documentation for the project at: {input.output_dir}/

      Architecture: {architecture}

      Create:
      1. **README.md** with:
         - Project description
         - Quick start (install, configure, run)
         - API documentation
         - Architecture overview
         - Contributing guidelines
      2. **API.md** with detailed endpoint documentation

      Write for a developer who has never seen this project.
    output_var: docs_result
    timeout_ms: 180000

  # ── STEP 5: Validate ──────────────────────────────────────────

  - id: validate
    type: agent
    label: "Validate project"
    depends_on: [write_docs]
    model: claude-sonnet-4-6
    tools: [Bash, Read, Glob]
    prompt: |
      Validate the generated project at: {input.output_dir}/

      1. Check that all files from the architecture exist
      2. Try to install dependencies (npm install / pip install)
      3. Check for TypeScript/syntax errors if applicable
      4. Verify the README is complete

      Report:
      - Files created: X
      - Dependencies: installed / failed
      - Syntax check: pass / fail
      - Missing files: list

      If everything passes, end with: "Project scaffold complete and validated."
    output_var: validation
    timeout_ms: 180000

output: validation
