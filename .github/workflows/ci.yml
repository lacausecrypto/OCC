name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 for action runtimes ahead of the 2026-06-02 GitHub deadline.
# This affects the JavaScript runtime of actions (checkout, setup-node, …) — not
# the matrix.node-version below, which is the Node used to run our code.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (mcp-server)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python (needed by node-gyp for better-sqlite3)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
        env:
          npm_config_python: python3

      - name: Security audit
        working-directory: mcp-server
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: mcp-server
        run: npm run lint

      - name: Type check
        working-directory: mcp-server
        run: npx tsc --noEmit

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test coverage
        working-directory: mcp-server
        run: npm run test:coverage

  frontend:
    name: Frontend (React SPA)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Security audit
        working-directory: frontend-react
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend-react
        run: npm run lint

      - name: Type check
        working-directory: frontend-react
        run: npx tsc -b

      - name: Build
        working-directory: frontend-react
        run: npm run build

      - name: Run tests
        working-directory: frontend-react
        run: npm test

      - name: Build Storybook
        working-directory: frontend-react
        run: npm run build-storybook
